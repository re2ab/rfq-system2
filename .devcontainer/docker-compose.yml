services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: rfq_core
      DB_USERNAME: rfq
      DB_PASSWORD: rfq_secret
    depends_on:
      - db
    networks:
      - rfq

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: rfq_core
      MYSQL_USER: rfq
      MYSQL_PASSWORD: rfq_secret
    ports:
      - "3306:3306"
    volumes:
      - rfq-mysql:/var/lib/mysql
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    networks:
      - rfq

volumes:
  rfq-mysql:

networks:
  rfq:
