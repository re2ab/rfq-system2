# این فایل به Nixpacks (سیستم بیلد پیش‌فرض Railway برای این سرویس) می‌گوید
# که علاوه بر PHP و پکیج‌های خودکارشناسایی‌شده، باینری LibreOffice (soffice)
# را هم روی ایمیج نصب کند — تا سرویس تبدیل PDF واقعی (LibreOfficePdfConverter)
# در برنامه فعال شود. اکستنشن‌های PHP (مثل imap/zip) از طریق "require" در
# composer.json مدیریت می‌شوند، نه این فایل.
#
# اصلاح M29 (بعد از گزارش کاربر که PDF هنوز فعال نشده بود): نسخه‌ی قبلی این
# فایل فقط nixPkgs = ["libreoffice"] بود — بدون علامتِ "..." در ابتدای آرایه.
# طبق مستنداتِ Nixpacks/تجربه‌ی جامعه‌ی Railway (تأییدشده با WebSearch/
# WebFetch از station.railway.com، نه حدس)، وقتی phases.setup.nixPkgs در
# nixpacks.toml بدونِ "..." نوشته شود، ممکن است کاملِ لیستِ پکیج‌های
# خودکارشناسایی‌شده‌ی همان فاز را به‌جایِ «اضافه‌کردن» به آن‌ها، override کند —
# «...» صریحاً یعنی «همان پیش‌فرض‌ها + این یکی، نه به‌جایشان». این می‌تواند
# دقیقاً همان چیزی باشد که نصبِ LibreOffice را در بیلدِ این سرویس بی‌اثر
# کرده. نسخه‌ی درست‌شده:
[phases.setup]
nixPkgs = ["...", "libreoffice"]
